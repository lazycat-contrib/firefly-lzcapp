name: Firefly WireGuard Server
package: lazycat.community.app.firefly-wg
version: 4.4.0
min_os_version: 1.3.8
description: 最简单易用的轻量级、高性能 WireGuard 服务端软件，可广泛用于异地组网、远程办公、内网穿透等场景。
homepage: https://github.com/Safe3/firefly
author: Safe3
application:
    subdomain: firefly-wg
    public_path:
        - /
    routes:
        - /=http://host.lzcapp:50121
    background_task: true

locales:
    zh:
        name: "萤火虫 WireGuard Server"
        description: "最简单易用的轻量级、高性能 WireGuard 服务端软件，可广泛用于异地组网、远程办公、内网穿透等场景。"
    zh_CN:
        name: "萤火虫 WireGuard Server"
        description: "最简单易用的轻量级、高性能 WireGuard 服务端软件，可广泛用于异地组网、远程办公、内网穿透等场景。"
    en:
        name: "Firefly WireGuard Server"
        description: "Firefly is a simple and easy to install WireGuard server software, which can be widely used in scenarios such as remote networking, remote work, and expose a local server behind a NAT or firewall to the internet."
    ja:
        name: "萤火虫 WireGuard Server"
        description: "最も簡単で使いやすい軽量かつ高性能なWireGuardサーバーソフトウェアであり、遠隔地のネットワーク構築、リモートワーク、イントラネット透過などのシーンで広く利用できます。"

services:
    firefly:
        #  uusec/firefly:4.4
        image: registry.lazycat.cloud/czyt/uusec/firefly:6a6da50a28226d77
        network_mode: host
        environment:
            - FIREFLY_PASSWORD={{ .U.firefly_password}}
            - TZ=Asia/Shanghai
              #- FIREFLY_DEVICE=eth0
              #- FIREFLY_AUTO_SSL=false
              #- FIREFLY_PORT=50121
        binds:
            - /lzcapp/var/conf:/firefly/conf
