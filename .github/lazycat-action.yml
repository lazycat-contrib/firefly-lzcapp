version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/firefly.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: firefly

build:
  run_buildscript: false

images:
  # 主应用：上游只有两段式版本 tag（4.2/4.3/4.4 + v3.1），无完整三段 SemVer → custom + 版本映射 {version}.0
  - id: firefly
    target: service
    service: firefly
    source: uusec/firefly
    channel: custom
    sort: semver
    tag_regex: '^v?\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+)$'
    version_template: '{version}.0'
    delivery:
      mode: mirror

stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Firefly WireGuard Server
    summary: "最简单易用的轻量级、高性能 WireGuard 服务端软件"
